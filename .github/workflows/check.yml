name: Check Store Skills action

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Exercise preflight rejection
        id: missing-credential
        continue-on-error: true
        uses: ./
        with:
          storefront-url: https://example.com/
          openai-api-key: fixture-unused
        env:
          GLUE_MCP_URL: https://example.com/api/glue/projects/fixture/mcp
      - name: Check that the action refused to run
        if: steps.missing-credential.outcome != 'failure'
        run: exit 1
